<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>kkullm — drawn toward the work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/markdown.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script src="/static/vendor/sortable.min.js"></script>
</head>
<body x-data="kkullm()" x-cloak
      :data-compose-open="composeOpen"
      @keydown.window="handleKeydown($event)">

  <!-- Grain / texture overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Mobile top bar (phone only) -->
  {{template "topbar_mobile" .}}

  <!-- Nav Bar -->
  <nav class="nav">
    <div class="nav-left">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">끌림</span>
        <span class="brand-name">kkullm</span>
      </a>
      <div class="nav-rule" aria-hidden="true"></div>
      <div class="nav-selectors">
        <label class="nav-segment" :class="{ active: viewMode === 'project' }">
          <input type="radio" value="project" x-model="viewMode" @change="loadBoard()">
          <span>Project</span>
        </label>
        <label class="nav-segment" :class="{ active: viewMode === 'agent' }">
          <input type="radio" value="agent" x-model="viewMode" @change="loadBoard()">
          <span>Agent</span>
        </label>
      </div>
      <template x-if="viewMode === 'project'">
        <div class="nav-select-wrap">
          <select class="nav-select" x-model="currentProject" @change="loadBoard()" aria-label="Project">
            <template x-for="p in projects" :key="p.id">
              <option :value="p.id" x-text="p.name"></option>
            </template>
          </select>
          <span class="nav-select-caret" aria-hidden="true">▾</span>
        </div>
      </template>
      <template x-if="viewMode === 'agent'">
        <div class="nav-select-wrap">
          <select class="nav-select" x-model="currentAgent" @change="loadBoard()" aria-label="Agent">
            <template x-if="agents.length === 0">
              <option value="">(no agents)</option>
            </template>
            <template x-for="a in agents" :key="a.id">
              <option :value="a.id" x-text="a.name + ' · ' + a.project"></option>
            </template>
          </select>
          <span class="nav-select-caret" aria-hidden="true">▾</span>
        </div>
      </template>
    </div>
    <div class="nav-right">
      <button class="nav-blockers"
              :class="{ 'hide-mode': blockersOpen }"
              x-show="blockerCount > 0"
              @click="toggleBlockers()">
        <span class="blocker-dot" aria-hidden="true"></span>
        <span x-text="blockersOpen ? 'Hide blocked' : 'Blocked'"></span>
        <span class="blocker-count" x-text="blockerCount"></span>
      </button>
      <button class="nav-archived" @click="loadArchived()" title="Archived">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="1.5" y="3" width="11" height="2.6" rx="0.4" stroke="currentColor" stroke-width="1.2"/>
          <path d="M2.5 5.6V11a0.5 0.5 0 00.5.5h8a0.5 0.5 0 00.5-.5V5.6" stroke="currentColor" stroke-width="1.2"/>
          <path d="M5.5 8h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span>Archive</span>
      </button>
      <button class="btn-compose" @click="openCompose()" title="Compose (n)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Compose</span>
        <kbd class="kbd-hint">n</kbd>
      </button>
      <div class="nav-menu" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false">
        <button class="icon-btn" @click="open = !open" :aria-expanded="open" aria-haspopup="true" aria-label="Menu" title="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="nav-menu-dropdown" x-show="open" x-cloak x-transition.opacity.duration.120ms role="menu">
          <a href="/admin" class="nav-menu-item" role="menuitem">Admin</a>
          <button type="button" class="nav-menu-item" role="menuitem" @click="toggleTheme(); open = false">
            <span x-text="theme === 'dark' ? 'Light mode' : 'Dark mode'"></span>
            <template x-if="theme === 'dark'">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 1.5v1.6"/><path d="M8 12.9v1.6"/><path d="M14.5 8h-1.6"/><path d="M3.1 8H1.5"/><path d="M12.6 3.4l-1.1 1.1"/><path d="M4.5 11.5l-1.1 1.1"/><path d="M12.6 12.6l-1.1-1.1"/><path d="M4.5 4.5L3.4 3.4"/></g></svg>
            </template>
            <template x-if="theme !== 'dark'">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.5A5.6 5.6 0 016.5 2.5a5.6 5.6 0 107 7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </template>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Board container (populated by htmx) -->
  <div id="board-container"
       hx-get="/ui/board?project={{.DefaultProjectID}}"
       hx-trigger="load"
       hx-target="#board-container"
       hx-swap="innerHTML">
  </div>

  <!-- Drawer overlay -->
  <div class="drawer-overlay" :class="{ open: drawerOpen }" @click="closeDrawer()"></div>

  <!-- Drawer -->
  <div class="drawer" :class="{ open: drawerOpen }" id="drawer-container">
  </div>

  <!-- Compose modal -->
  {{template "compose" .}}

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Mobile picker sheet (phone only) -->
  {{template "picker_sheet" .}}

  <!-- Mobile overflow menu (phone only) -->
  {{template "overflow_sheet" .}}

  <!-- Mobile quick-capture (phone only) -->
  {{template "quick_capture" .}}

  <!-- Bootstrap data for Alpine (server-rendered initial state) -->
  <script id="boot-data" type="application/json">{{.BootData}}</script>

  <script src="/static/js/app.js"></script>
</body>
</html>
