{{define "admin_agents"}}
{{template "admin_shell_top" .}}
<h1>Agents</h1>
<p class="admin-desc">Rename or delete agents. Deleting an agent unassigns their cards; their comments are preserved with attribution.</p>
<ul class="admin-list">
{{range .Agents}}
  <li class="admin-row">
    <form method="post" action="/admin/agents/{{.ID}}/rename" class="inline-rename">
      <input type="text" name="name" value="{{.Name}}" class="inline-rename-input" aria-label="Agent name">
    </form>
    <span class="admin-meta">project: {{.Project}}</span>
    <form method="post" action="/admin/agents/{{.ID}}/delete" class="admin-delete-form">
      <button type="submit" class="btn-outlined-danger"
              onclick="return confirm('Delete agent {{.Name}}? Their cards will be unassigned; comments preserved.')">Delete</button>
    </form>
  </li>
{{end}}
</ul>
{{template "admin_shell_bottom" .}}
{{end}}
