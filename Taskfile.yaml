version: '3'

vars:
  BINARY: kkullm

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Compile the kkullm binary into the repo root
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - web/static/**/*
      - web/templates/**/*
      - db/migrations/**/*
    generates:
      - '{{.BINARY}}'

  clean:
    desc: Remove the compiled binary
    cmds:
      - rm -f {{.BINARY}}

  test:
    desc: Run the full Go test suite
    cmds:
      - go test ./...

  dev-seed:
    desc: Reset and reseed the dev DB with beehive/birds_nest/ant_hill demo data (requires `kkullm serve` running)
    cmds:
      - ./scripts/dev-seed.sh
    interactive: true
